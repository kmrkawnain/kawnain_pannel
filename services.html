<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | BoostPanel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
        <div class="container">
            <a class="navbar-brand text-gradient" href="index.html">
                <i class="bi bi-rocket-takeoff-fill me-2"></i>BoostPanel
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="order.html">Place Order</a></li>
                    <li class="nav-item"><a class="nav-link" href="track-order.html">Track Order</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container fade-in">
            <h2 class="mb-4">Our <span class="text-gradient">Services</span></h2>
            
            <div class="glass-card p-4 mb-4">
                <div class="row g-3">
                    <div class="col-md-4">
                        <select class="form-select" id="filterCategory">
                            <option value="All">All Categories</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="searchService" placeholder="Search by name or ID...">
                    </div>
                </div>
            </div>

            <div class="glass-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-dark bg-opacity-50">
                            <tr>
                                <th>ID</th>
                                <th>Service Name</th>
                                <th>Min / Max</th>
                                <th>Speed</th>
                                <th>Refill</th>
                                <th>Price (per 1000)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="servicesTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 BoostPanel SMM.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/services.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('servicesTableBody');
            const filterCategory = document.getElementById('filterCategory');
            const searchService = document.getElementById('searchService');

            // Populate categories
            const categories = getAllCategories();
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                filterCategory.appendChild(opt);
            });

            function renderTable() {
                const catFilter = filterCategory.value;
                const searchVal = searchService.value.toLowerCase();

                let filtered = smmServices;
                if (catFilter !== 'All') {
                    filtered = filtered.filter(s => s.category === catFilter);
                }
                if (searchVal) {
                    filtered = filtered.filter(s => 
                        s.name.toLowerCase().includes(searchVal) || 
                        s.id.toLowerCase().includes(searchVal)
                    );
                }

                tableBody.innerHTML = '';
                filtered.forEach(s => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${s.id}</td>
                            <td>
                                <strong>${s.name}</strong>
                                <div class="small text-muted">${s.category} | Start: ${s.startTime}</div>
                            </td>
                            <td>${s.min} / ${s.max}</td>
                            <td>${s.speed}</td>
                            <td>${s.refill}</td>
                            <td class="text-primary fw-bold">${formatCurrency(s.price)}</td>
                            <td>
                                <a href="order.html?service=${s.id}" class="btn btn-sm btn-outline-primary">Order</a>
                            </td>
                        </tr>
                    `;
                });
            }

            filterCategory.addEventListener('change', renderTable);
            searchService.addEventListener('input', renderTable);
            
            renderTable();
        });
    </script>
</body>
</html>
